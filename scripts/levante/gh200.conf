# Shared settings of the scripts/levante/ GH200 scripts (sourced by each). Override any of them in the environment,
# e.g.  POOL=/work/bk1415/a270044/other sbatch ...
LEV_USER=${LEV_USER:-a270044}
POOL=${POOL:-/work/bk1415/$LEV_USER/fesom_jax_pool}         # the data pool (scripts/albedo/levante_pool.py)
WT=${WT:-/work/bk1415/$LEV_USER/fesom_jax_recom}            # the checkout of this repository on Levante
VENV=${VENV:-$POOL/envs/fesom-jax-gh200}                    # the aarch64 venv (make_env_gh200.sbatch)
WHEELS=${WHEELS:-$POOL/envs/wheels_aarch64}                 # its wheels (fetch_wheels.sh)
RUNS=${RUNS:-$POOL/runs}                                    # run output; slurm logs in $RUNS/slurm
SCRATCH_TMP=${SCRATCH_TMP:-/scratch/${LEV_USER:0:1}/$LEV_USER/fesom_jax_tmp}
