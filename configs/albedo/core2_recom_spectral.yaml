# Albedo: CORE2 + the spectral REcoM fork (4 phytoplankton groups, CDOM, 13-band OASIM light; 37 tracers) in double
# precision on ONE GPU (docs/recom/RUNNING_ALBEDO.md, docs/plans/completed/20261028-recom-spectral-port.md). Physics and inputs
# as configs/albedo/core2_recom.yaml; REcoM from the fork's namelist set (scripts/recom/fortran/namelists_albedo_spectral/),
# the optics tables and the OASIM monthly climatology as the pi spectral run. The CORE2 REcoM IC set (DIC_PI: the
# GLODAP preindustrial DIC) and the Albani dust from /albedo/pool/FESOM2/recom; the fork's constants for the other
# tracers (fesom_jax.recom.tracers.init_value). A cold start.
ale: {}
gm: {}
kpp: null
tke: {}
ice: {whichEVP: 1}
visc: {}
tracer: {}

dt: 1800.0

mesh: /albedo/work/projects/p_specbic/sloza/fesom_jax_data/core2_mesh_ic/mesh_core2
partition: null
forcing:
  kind: core2
  start_year: 1958
  mslp: true
  jra_dir: /albedo/work/projects/p_specbic/sloza/fesom_jax_data/forcing_1958_mslp
  sss_path: /albedo/work/projects/p_specbic/sloza/fesom_jax_data/core2_mesh_ic/PHC2_salx.nc
  runoff_path: /albedo/work/projects/p_specbic/sloza/fesom_jax_data/core2_mesh_ic/CORE2_runoff.nc
  chl_path: /albedo/work/projects/p_specbic/sloza/fesom_jax_data/core2_mesh_ic/Sweeney_2005.nc
  dust_file: /albedo/pool/FESOM2/recom/CORE2/DustClimMonthlyAlbani.nc
  oasim_dir: /albedo/work/projects/p_specbic/sloza/forcing_oasim_v2
  oasim_pattern: oasim_clim1998-2012_darwin400.nc

recom:
  namelist: scripts/recom/fortran/namelists_albedo_spectral/namelist.recom   # 37 tracers: 3zoo2det + coccos + CDOM
  spectral: true
  spectral_co2lim: true                 # the user's deviation from the fork (2026-10-28): CO2 limitation in the spectral growth
  optics_dir: /albedo/work/projects/p_specbic/sloza/fesom_jax_data/recom_pi/optics
  ic_set: core2
  ic_dir: /albedo/pool/FESOM2/recom
  output: [DIC, Alk, DIN, DSi, DFe, O2, Chl, co2flux, pco2surf, npp, export100]

gpu:
  column_unroll: true
  column_kernel: true
  chunk_steps: 48
output_dir: /albedo/work/projects/p_specbic/sloza/fesom_jax_runs/core2_recom_spectral
snapshot_every: 0
checkpoint_every: 0
restart_in: null
restart_out: null
duration: 1yr             # overridden by --steps
