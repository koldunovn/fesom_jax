# Albedo: the full-step gate G4b (fesom_jax/tests/test_recom_step_fork.py) for the spectral REcoM on FESOM 2.8
# (sveta-loza/fesom2 fesom2.8_recom_spectral, docs/plans/20261102-fortran-spectral-on-fesom28.md, step 5.4): one JAX
# step from the twin's step-0 state against the twin's step 1. The twin (run fesom28_spectral_pi_1d_dumps, job
# 48698141) runs scripts/recom/fortran/namelists_albedo_fesom28_spectral/: the physics of the 692f804 twin's
# namelists_jaxphys (FESOM2 upstream format) with the fork's namelist.recom and &tracer_init3d.
# As configs/albedo/pi_recom_spectral_g4b.yaml (the fork on its old FESOM2 base) except:
#   gm: {}               GM/Redi on, as the 2.8 namelists (Fer_GM = Redi = .true., K_GM_max 1000, as the 692f804
#                        twin): the 2.8 host has the GM/Redi fesom-jax follows
#   mesh                 mesh_pi_fork as the old-base gate: the twin runs on mesh_pi_part, whose level files were
#                        written by the fork's fesom_ini; the packaged pi mesh differs at one node by 3 levels, which
#                        alone gave a T/S "floor" of 0.93 through the wet mask, job 48698146)
#   recom.namelist       the 2.8 twin's (identical to namelists_albedo_spectral_jaxphys/namelist.recom)
# and the test passes none of the legacy_* step kwargs: FESOM 2.8 has #944, #1116 and 18346243.
ale: {}
gm: {}
kpp: null
tke: {}
ice: {whichEVP: 1}
visc: {}
tracer: {}
dt: 2700.0
mesh: /albedo/work/projects/p_specbic/sloza/fesom_jax_data/mesh_pi_fork
partition: null
forcing:
  kind: core2
  start_year: 1958
  mslp: true
  jra_dir: /albedo/work/projects/p_specbic/sloza/fesom_jax_data/forcing_1958_mslp
  sss_path: /albedo/work/projects/p_specbic/sloza/fesom_jax_data/core2_mesh_ic/PHC2_salx.nc
  runoff_path: /albedo/work/projects/p_specbic/sloza/fesom_jax_data/core2_mesh_ic/CORE2_runoff.nc
  chl_path: /albedo/work/projects/p_specbic/sloza/fesom_jax_data/core2_mesh_ic/Sweeney_2005.nc
  dust_file: /albedo/work/projects/p_specbic/sloza/fesom_jax_data/recom_pi/DustClimMonthlyAlbani_pimesh.nc
  oasim_dir: /albedo/work/projects/p_specbic/sloza/forcing_oasim_v2
  oasim_pattern: oasim_clim1998-2012_darwin400.nc
recom:
  namelist: scripts/recom/fortran/namelists_albedo_fesom28_spectral/namelist.recom   # 37 tracers: 3zoo2det + coccos + CDOM
  spectral: true
  spectral_co2lim: false
  optics_dir: /albedo/work/projects/p_specbic/sloza/fesom_jax_data/recom_pi/optics
  ic_set: pi
  ic_dir: /albedo/work/projects/p_specbic/sloza/fesom_jax_data/recom_pi
  output: [DIC, Alk, DIN, DSi, DFe, O2, Chl, co2flux, pco2surf, npp, export100]
output_dir: /albedo/work/projects/p_specbic/sloza/fesom_jax_runs/pi_recom_spectral_g4b_fesom28
snapshot_every: 0
checkpoint_every: 0
restart_in: null
restart_out: null
duration: 32step          # one day; the gate runs one step
