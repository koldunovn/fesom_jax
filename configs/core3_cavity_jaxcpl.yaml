# Lane L-SFC: configs/core3_cavity.yaml (lane L-OCN: CORE3 with cavities, linfs, the converted jaxcpl 1855 restart,
# forced JRA55-do) with jaxcpl's ocean settings of configs/core2_cpl_jaxcpl.yaml (GM/Redi, opt_visc 5, the sea-ice
# values and switches). Double precision. The forced path's sea-ice thermodynamics have no ponds; the coupled-only
# switches (cpl_meltponds, snowmelt_tgate, alb_tramp, pnd_*) have no effect here.
# CORE3 (220,509 nodes, 48 levels) with ice-shelf cavities -- lane L-OCN (docs/lanes/core3.md).
# Standalone JRA55-do from jaxcpl's 1855-01-01 spinup ocean (converted Fortran restart, relabelled 1958-01-01 so that
# the 1958 forcing applies, exactly as the FESOM2 main oracle run_cav_dp is set up).
#
# Physics: linfs (jaxcpl's which_ale), TKE, mEVP, GM, cavities with jaxcpl's cavity_gamma_scale. jaxcpl's own GM/Redi
# scalings, TKE constants, opt_visc 5, melt ponds and single precision are lane L-SFC's; this config keeps
# fesom_jax's defaults for them.

ale: null          # linfs (jaxcpl); the cavity physics is wired for linfs only
gm:
  k_gm_max: 2500.0
  redi_kmax_default: 1000.0
  k_gm_max_nh: 1000.0
  k_gm_hemi_trans: 10.0
  # REPRODUCES A FESOM2 BUG, NOT PHYSICS: init_Redi_GM builds the GM profile from the wrong level at the ice-shelf
  # front and under parts of the shelves (oce_fer_gm.F90:223,304-306 vs :349,439,443; fer_K = 500 from
  # oce_setup_step.F90:1042). Only to compare with Fortran FESOM2 0aaa2d73 runs such as jaxcpl; the correct
  # behaviour is false (the default). Filed upstream (FESOM/fesom2). See GMConfig and docs/lanes/core3_sfc.md.
  reproduce_fesom_bug_kgm_surface_level: true
kpp: null
tke: {}
ice:
  whichEVP: 1
  alpha_evp: 300.0
  beta_evp: 300.0
  ice_diff: 0.0
  albsn: 0.82
  albsnm: 0.65
  albi: 0.70
  albim: 0.68
  albw: 0.1
  mevp_mass_floor: true
  metric_factor_zero: true
cavity: {gamma_scale: 0.6}
visc:
  opt_visc: 5
  easybsreturn: 1.5
tracer: {}
dt: 1800.0

mesh: /work/ba1583/a270088/awicm/core3/ocn/mesh_core3
partition: serial
forcing:
  kind: core2
  start_year: 1958   # the restart is step 0 = 1958-01-01; run.py does not re-bootstrap AB2 after a restart
output_dir: /work/ba1583/a270088/awicm/core3/sfc/runs/core3_cavity_jaxcpl
snapshot_every: 48
checkpoint_every: 0
restart_in: /work/ba1583/a270088/awicm/core3/ocn/restart_jaxcpl_18550101_as_1958_v2
restart_out: null
duration: 5day
