# CORE2 ocean for the coupled AWI-CM JAX system (awicm_jax, plan ~/awicm_jax/docs/plans/20261101-awicm-jax-coupling.md,
# decision 3): configs/core2_gpu.yaml's physics and speed options at dt 1800 (four ocean steps per 7200 s coupling
# interval), in single precision (FESOM2 #1207, accepted at STOP 4 2026-10-21), on ONE GPU (partition serial).
# Differences from core2_gpu.yaml, each with its reason:
#   * precision: single, and gpu.ordered_sums (core2_gpu_fast.yaml pairs the two: SP -16 % on 4 GH200, job 28295508);
#   * partition: serial (one A100, plan decision 7); the multi-GPU options (halo_compact, mevp_wide, lane_order)
#     are no-ops at one device and are left out;
#   * forcing.on_device off: the coupled path feeds the per-step forcing as arrays (fesom_jax.coupled), and the
#     file-driven twin of the mode B check must take the same host-built StepForcing (the on-device tables are
#     value-equivalent only: XLA contracts rdate*a+b into an FMA);
#   * the speed options that need dt 2700 or come with it (split-explicit SSH, ice_ave_steps 2) are not taken:
#     the CG with the Chebyshev preconditioner and the gathered solve stays, the sea ice runs every step (as
#     AWI-ESM3 v3.5.1's namelist.ice, ice_ave_steps = 1).
# The coupled driver reads this file through fesom_jax.coupled.init_ocean; scripts/run_from_config.py runs it
# standalone (the file-driven reference of the checks).

ale: {}            # zstar
gm: {}             # GM/Redi
kpp: null
tke: {}            # classical TKE
ice: {whichEVP: 1}  # mEVP, ice every step
visc: {}
tracer: {}

dt: 1800.0

mesh: data/mesh_core2
partition: serial
forcing:
  kind: core2
  start_year: 1958   # the calendar origin of the CORE2 hindcast restarts (their step counts from 1958-01-01)
ssh:
  cheb_degree: 3
  cheb_kappa: 30.0
  gathered: true
gpu:
  column_unroll: true
  ssh_ell: true
  cg_batch: 4
  mevp_unroll: 12
  column_kernel: true
  ssh_inc_ell: true
  ordered_sums: true
  output_async: true
  restart_async: true
  forcing_ahead: 2
output_dir: /work/ba1583/a270088/awicm/ocn/runs
snapshot_every: 48
checkpoint_every: 1440
# The ocean initial state of the coupled run (plan decision 8): the CORE2 hindcast v3 (fesom_jax, JRA55-do from
# PHC at rest on 1958-01-01, dt 1800, double precision) on 1989-01-01, step 543504.
restart_in: /work/ab0995/a270088/port_jax/runs/core2_hindcast_v3/restart_archive/fesom.1989.001.00000
restart_out: null
duration: 31d
precision: single
